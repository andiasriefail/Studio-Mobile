import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.SimpleRemapper
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

// ASM is only used by the patchEcj task below (build time, never packaged into the APK).
buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'org.ow2.asm:asm:9.7.1'
        classpath 'org.ow2.asm:asm-commons:9.7.1'
    }
}

plugins {
    alias(libs.plugins.android.application)
}

/**
 * ECJ 3.46 calls java.lang.Runtime.version() / Runtime.Version, which Android does not have ("NoClassDefFoundError: Failed resolution of:
 * Ljava/lang/Runtime$Version;" inside Parser.parse). This rewrites the ECJ jar at build time: Runtime.version() becomes
 * com.example.studiomobile.compat.RuntimeVersion.current() and every reference to java.lang.Runtime$Version becomes RuntimeVersion.
 */
class EcjRuntimeVersionPatcher {
    static final String OLD_TYPE = 'java/lang/Runtime$Version'
    static final String RUNTIME = 'java/lang/Runtime'
    static final String SHIM = 'com/example/studiomobile/compat/RuntimeVersion'

    /** @return how many classes were rewritten */
    static int patch(File input, File output) {
        int changed = 0
        byte[] needle = OLD_TYPE.getBytes('ISO-8859-1')
        ZipFile zip = new ZipFile(input)
        try {
            ZipOutputStream out = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(output)))
            try {
                Enumeration entries = zip.entries()
                while (entries.hasMoreElements()) {
                    ZipEntry entry = (ZipEntry) entries.nextElement()
                    String name = entry.getName()
                    // The patched jar is no longer what the signature files signed.
                    if (name.startsWith('META-INF/') && (name.endsWith('.SF') || name.endsWith('.RSA') || name.endsWith('.DSA') || name.endsWith('.EC'))) continue
                    byte[] data = entry.isDirectory() ? new byte[0] : zip.getInputStream(entry).getBytes()
                    if (name.endsWith('.class') && !name.endsWith('module-info.class') && indexOf(data, needle) >= 0) {
                        data = rewrite(data)
                        changed++
                    }
                    out.putNextEntry(new ZipEntry(name))
                    out.write(data)
                    out.closeEntry()
                }
            } finally {
                out.close()
            }
        } finally {
            zip.close()
        }
        return changed
    }

    static byte[] rewrite(byte[] classBytes) {
        ClassReader reader = new ClassReader(classBytes)
        ClassWriter writer = new ClassWriter(0)
        ClassVisitor remap = new ClassRemapper(writer, new SimpleRemapper(Collections.singletonMap(OLD_TYPE, SHIM)))
        reader.accept(new RuntimeVersionClassVisitor(remap), 0)
        return writer.toByteArray()
    }

    static int indexOf(byte[] data, byte[] needle) {
        for (int i = 0; i <= data.length - needle.length; i++) {
            int j = 0
            while (j < needle.length && data[i + j] == needle[j]) j++
            if (j == needle.length) return i
        }
        return -1
    }
}

class RuntimeVersionClassVisitor extends ClassVisitor {
    RuntimeVersionClassVisitor(ClassVisitor next) { super(Opcodes.ASM9, next) }

    @Override
    void visitInnerClass(String name, String outerName, String innerName, int access) {
        // RuntimeVersion is not a nested class of java.lang.Runtime, so the InnerClasses entry must go.
        if (EcjRuntimeVersionPatcher.OLD_TYPE.equals(name)) return
        super.visitInnerClass(name, outerName, innerName, access)
    }

    @Override
    MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
        return new RuntimeVersionMethodVisitor(super.visitMethod(access, name, descriptor, signature, exceptions))
    }
}

class RuntimeVersionMethodVisitor extends MethodVisitor {
    RuntimeVersionMethodVisitor(MethodVisitor next) { super(Opcodes.ASM9, next) }

    @Override
    void visitMethodInsn(int opcode, String owner, String name, String descriptor, boolean isInterface) {
        if (opcode == Opcodes.INVOKESTATIC && EcjRuntimeVersionPatcher.RUNTIME.equals(owner) && 'version'.equals(name) && descriptor.startsWith('()')) {
            // Runtime.version() -> RuntimeVersion.current(); the return type Runtime$Version is remapped afterwards by ClassRemapper.
            super.visitMethodInsn(opcode, EcjRuntimeVersionPatcher.SHIM, 'current', descriptor, false)
            return
        }
        super.visitMethodInsn(opcode, owner, name, descriptor, isInterface)
    }
}

android {
    namespace = "com.example.studiomobile"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.studio.mobile.apk.vhynlain"
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    packaging {
        jniLibs {
            // libaapt2.so must be extracted to nativeLibraryDir so it can be executed
            // (Android 10+ blocks executing files from app-private storage).
            useLegacyPackaging = true
        }
        resources {
            // kotlin-compiler-embeddable and kotlin-stdlib both ship *.kotlin_builtins files (kotlin/kotlin.kotlin_builtins, kotlin/reflect/..., etc.).
            pickFirsts += ["**/*.kotlin_builtins", "**/*.kotlin_metadata"]
            excludes += [
                "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*",
                "META-INF/*.kotlin_module", "META-INF/versions/**", "META-INF/MANIFEST.MF",
                "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "license/*"
            ]
        }
    }
}

configurations.create('ecjRaw') {
    canBeConsumed = false
    canBeResolved = true
}

def ecjPatchedJar = layout.buildDirectory.file('patched-libs/ecj-patched.jar')

tasks.register('patchEcj') {
    def rawEcj = configurations.getByName('ecjRaw')
    inputs.files(rawEcj)
    outputs.file(ecjPatchedJar)
    doLast {
        File source = rawEcj.files.find { it.name.startsWith('ecj-') && it.name.endsWith('.jar') }
        if (source == null) throw new GradleException("ECJ jar not found in ${rawEcj.files}")
        File target = ecjPatchedJar.get().asFile
        target.parentFile.mkdirs()
        int changed = EcjRuntimeVersionPatcher.patch(source, target)
        if (changed == 0) logger.warn("patchEcj: no class in ${source.name} referenced java.lang.Runtime\$Version; the jar was copied unchanged (patch may no longer be needed).")
        else logger.lifecycle("patchEcj: rewrote ${changed} class(es) in ${source.name} to use RuntimeVersion instead of java.lang.Runtime\$Version")
    }
}

def patchedEcjFiles = files(ecjPatchedJar) { builtBy 'patchEcj' }

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.documentfile
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"

    // Build engine: in-process Java/Kotlin compiler, DEX, APK signing
    implementation patchedEcjFiles // libs.build.ecj after the patchEcj task rewrote Runtime.Version (see above)
    add('ecjRaw', libs.build.ecj) { transitive = false }
    implementation libs.build.kotlin.compiler.embeddable
    implementation libs.build.r8
    implementation libs.build.apksig
    implementation libs.build.bouncycastle
    // .tar.xz extraction (Android-host NDK archives), see SecureTarExtractor
    implementation libs.build.xz
    // JavaScript runner (Rhino 1.9.1: pure Java, runs on any ABI), see JavaScriptRunner
    implementation libs.build.rhino
    // QuickJS runs Sucrase to turn JSX/TypeScript into JavaScript during a build (32-bit and 64-bit), see QuickJsSucraseTranspiler
    implementation libs.build.quickjs

    // javax.annotation.processing / javax.lang.model / javax.tools API classes that Android does not ship (taken from the JDK 17+
    // java.compiler module, GPLv2 + Classpath Exception; SourceVersion and ToolProvider are left out because
    // src/main/java/javax/lang/model/SourceVersion.java replaces the former and the latter needs a JDK). ECJ's annotation processing
    // and AnnotationProcessingRunner need them at runtime. The same jar is copied from assets for D8 (see LocalBuildPipeline).
    implementation files("src/main/assets/build-tools/java-compiler-api.jar")

    // JVM unit tests for the pure-Java build classes (no Android runtime needed)
    testImplementation libs.junit
}
