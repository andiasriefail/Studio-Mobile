pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories {
        // R8 9.4.29 is not on Google Maven; it is kept in the repo (local-maven/com/android/tools/r8/9.4.29/). Only this module is read from there.
        maven {
            url = uri("${rootDir}/local-maven")
            content { includeModule("com.android.tools", "r8") }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = 'StudioMobile'
include ':app'
