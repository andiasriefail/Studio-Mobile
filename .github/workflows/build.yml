name: Build Studio Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platforms
        run: |
          # Android 17 is published as platforms;android-37.0 (API level 37)
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          # Gradle (compileSdk = 37) looks for platforms/android-37; sdkmanager may install it as android-37.0
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          ls "$ANDROID_HOME/platforms"
      - name: Bundle android.jar into the app
        run: |
          # API 37: the folder is android-37.0 (or android-37), so look it up instead of hard-coding it
          p37=$(ls -d "$ANDROID_HOME"/platforms/android-37* | head -n 1)
          test -f "$p37/android.jar" || { echo "android.jar for API 37 not found under $ANDROID_HOME/platforms" >&2; exit 1; }
          cp "$p37/android.jar" "app/src/main/assets/local_libs/android-37.jar"
          ls -l app/src/main/assets/local_libs/
      - name: Bundle Material and AndroidX libraries for the preview
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/local_libs/maven
          python3 - app/src/main/assets/local_libs/maven <<'PY'
          import os, sys, time, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          out = sys.argv[1]
          bases = os.environ.get("PREVIEW_MAVEN_BASES", "https://dl.google.com/dl/android/maven2/ https://repo1.maven.org/maven2/").split()
          skip = {"org.jetbrains.kotlin:kotlin-stdlib", "org.jetbrains.kotlin:kotlin-stdlib-jdk7", "org.jetbrains.kotlin:kotlin-stdlib-jdk8", "org.jetbrains.kotlin:kotlin-stdlib-common", "org.jetbrains.kotlin:kotlin-stdlib-js"}
          required = {"com.google.android.material:material:1.12.0", "androidx.appcompat:appcompat:1.7.0", "androidx.constraintlayout:constraintlayout:2.1.4", "androidx.recyclerview:recyclerview:1.3.2", "androidx.core:core-ktx:1.13.1"}
          roots = """
          com.google.android.material:material:1.9.0
          com.google.android.material:material:1.10.0
          com.google.android.material:material:1.11.0
          com.google.android.material:material:1.12.0
          com.google.android.material:material:1.13.0
          androidx.appcompat:appcompat:1.6.1
          androidx.appcompat:appcompat:1.7.0
          androidx.appcompat:appcompat:1.7.1
          androidx.constraintlayout:constraintlayout:2.1.4
          androidx.constraintlayout:constraintlayout:2.2.0
          androidx.constraintlayout:constraintlayout:2.2.1
          androidx.recyclerview:recyclerview:1.3.2
          androidx.recyclerview:recyclerview:1.4.0
          androidx.core:core-ktx:1.12.0
          androidx.core:core-ktx:1.13.1
          androidx.core:core-ktx:1.15.0
          androidx.core:core-ktx:1.16.0
          androidx.cardview:cardview:1.0.0
          androidx.coordinatorlayout:coordinatorlayout:1.2.0
          androidx.coordinatorlayout:coordinatorlayout:1.3.0
          androidx.drawerlayout:drawerlayout:1.2.0
          androidx.viewpager2:viewpager2:1.0.0
          androidx.viewpager2:viewpager2:1.1.0
          androidx.swiperefreshlayout:swiperefreshlayout:1.1.0
          androidx.slidingpanelayout:slidingpanelayout:1.2.0
          androidx.gridlayout:gridlayout:1.0.0
          androidx.gridlayout:gridlayout:1.1.0
          androidx.transition:transition:1.4.1
          androidx.transition:transition:1.5.0
          androidx.fragment:fragment-ktx:1.6.2
          androidx.fragment:fragment-ktx:1.8.5
          androidx.activity:activity-ktx:1.8.2
          androidx.activity:activity-ktx:1.9.3
          androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7
          androidx.lifecycle:lifecycle-livedata-ktx:2.8.7
          androidx.navigation:navigation-fragment-ktx:2.7.7
          androidx.navigation:navigation-fragment-ktx:2.8.5
          androidx.navigation:navigation-ui-ktx:2.7.7
          androidx.navigation:navigation-ui-ktx:2.8.5
          androidx.preference:preference-ktx:1.2.1
          androidx.webkit:webkit:1.11.0
          androidx.browser:browser:1.8.0
          androidx.legacy:legacy-support-v4:1.0.0
          com.google.android.flexbox:flexbox:3.0.0
          """.split()

          memo = {}
          poms = {}
          seen = set()
          wanted = set()
          failed = []

          def rel(g, a, v, ext):
              return g.replace(".", "/") + "/" + a + "/" + v + "/" + a + "-" + v + "." + ext

          def write(path, data):
              target = os.path.join(out, path)
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, "wb") as handle:
                  handle.write(data)

          def fetch(path, keep):
              if path in memo:
                  return memo[path]
              data = None
              for base in bases:
                  for attempt in range(4):
                      try:
                          request = urllib.request.Request(base + path, headers={"User-Agent": "studio-mobile-ci"})
                          with urllib.request.urlopen(request, timeout=60) as response:
                              data = response.read()
                          break
                      except urllib.error.HTTPError as error:
                          if error.code == 404:
                              break
                          time.sleep(2 * (attempt + 1))
                      except OSError:
                          time.sleep(2 * (attempt + 1))
                  else:
                      raise RuntimeError("network failure for " + base + path)
                  if data is not None:
                      break
              if keep:
                  memo[path] = data
                  if data is not None:
                      write(path, data)
              return data

          def local(element):
              return element.tag.rsplit("}", 1)[-1]

          def kid(element, name):
              if element is None:
                  return None
              for child in element:
                  if local(child) == name:
                      return child
              return None

          def kids(element, name):
              return [child for child in element if local(child) == name]

          def txt(element, name):
              child = kid(element, name)
              if child is not None and child.text and child.text.strip():
                  return child.text.strip()
              return None

          def interp(value, props):
              if value is None:
                  return None
              for _ in range(8):
                  start = value.find("${")
                  if start < 0:
                      break
                  end = value.find("}", start)
                  if end < 0:
                      break
                  replacement = props.get(value[start + 2:end])
                  if replacement is None:
                      break
                  value = value[:start] + replacement + value[end + 1:]
              return value

          def clean(value):
              value = value.strip()
              if value[:1] in ("[", "("):
                  for part in value.replace("[", "").replace("]", "").replace("(", "").replace(")", "").split(","):
                      if part.strip():
                          return part.strip()
              return value

          def read_pom(g, a, v, depth=0):
              key = (g, a, v)
              if key in poms:
                  return poms[key]
              data = fetch(rel(g, a, v, "pom"), True)
              if data is None:
                  poms[key] = None
                  return None
              project = ET.fromstring(data)
              pom = {"packaging": "jar", "props": {}, "managed": {}, "deps": []}
              group, version = txt(project, "groupId"), txt(project, "version")
              if txt(project, "packaging"):
                  pom["packaging"] = txt(project, "packaging")
              parent = kid(project, "parent")
              if parent is not None and depth < 6:
                  pg, pa, pv = txt(parent, "groupId"), txt(parent, "artifactId"), txt(parent, "version")
                  group = group or pg
                  version = version or pv
                  parent_pom = read_pom(pg, pa, pv, depth + 1)
                  if parent_pom:
                      pom["props"].update(parent_pom["props"])
                      pom["managed"].update(parent_pom["managed"])
              props = pom["props"]
              props["project.version"] = version or v
              props["project.groupId"] = group or g
              props["version"] = props["project.version"]
              props["pom.version"] = props["project.version"]
              properties = kid(project, "properties")
              if properties is not None:
                  for child in properties:
                      props[local(child)] = (child.text or "").strip()
              management = kid(project, "dependencyManagement")
              managed_deps = kid(management, "dependencies")
              imports = []
              if managed_deps is not None:
                  for d in kids(managed_deps, "dependency"):
                      managed_version, scope = txt(d, "version"), txt(d, "scope")
                      if scope == "import":
                          imports.append((interp(txt(d, "groupId"), props), interp(txt(d, "artifactId"), props), interp(managed_version, props)))
                          continue
                      if managed_version is not None:
                          pom["managed"][txt(d, "groupId") + ":" + txt(d, "artifactId")] = interp(managed_version, props)
              for bom_group, bom_artifact, bom_version in imports:
                  if bom_version is None or "${" in bom_version or depth >= 6:
                      continue
                  imported = read_pom(bom_group, bom_artifact, bom_version, depth + 1)
                  if imported:
                      for name, value in imported["managed"].items():
                          pom["managed"].setdefault(name, value)
              dependencies = kid(project, "dependencies")
              if dependencies is not None:
                  for d in kids(dependencies, "dependency"):
                      scope, kind, optional = txt(d, "scope"), txt(d, "type"), txt(d, "optional")
                      if scope in ("test", "provided", "system") or optional == "true":
                          continue
                      if kind is not None and kind not in ("jar", "aar", "bundle"):
                          continue
                      dg, da = interp(txt(d, "groupId"), props), interp(txt(d, "artifactId"), props)
                      dv = txt(d, "version")
                      dv = pom["managed"].get(dg + ":" + da) if dv is None else interp(dv, props)
                      pom["deps"].append((dg, da, dv))
              poms[key] = pom
              return pom

          def walk(g, a, v):
              if g + ":" + a in skip or (g, a, v) in seen:
                  return
              seen.add((g, a, v))
              pom = read_pom(g, a, v)
              if pom is None:
                  raise LookupError(g + ":" + a + ":" + v)
              if pom["packaging"] == "aar":
                  wanted.add((g, a, v))
              for dg, da, dv in pom["deps"]:
                  if dg + ":" + da in skip or dv is None or "${" in dv:
                      continue
                  walk(dg, da, clean(dv))

          for coordinate in roots:
              g, a, v = coordinate.split(":")
              try:
                  walk(g, a, v)
              except (LookupError, RuntimeError, ET.ParseError) as error:
                  failed.append(coordinate)
                  print("::warning::Preview bundle: " + coordinate + " skipped (" + str(error) + ")")

          for g, a, v in sorted(wanted):
              path = rel(g, a, v, "aar")
              if os.path.isfile(os.path.join(out, path)):
                  continue
              try:
                  data = fetch(path, False)
              except RuntimeError as error:
                  print("::warning::Preview bundle: " + path + " not downloaded (" + str(error) + ")")
                  continue
              if data is None:
                  print("::warning::Preview bundle: " + path + " was not found")
                  continue
              write(path, data)

          missing = [c for c in required if c in failed]
          print("Preview bundle: " + str(len(poms)) + " POM files, " + str(len(wanted)) + " AAR libraries, " + str(len(failed)) + " root(s) skipped")
          if missing:
              sys.exit("Required preview libraries are missing: " + ", ".join(missing))
          PY
          find app/src/main/assets/local_libs/maven -type f | wc -l
          du -sh app/src/main/assets/local_libs/maven
      - name: Download AAPT2 (ReVanced v1.1.0, build-tools 35.0.2)
        run: |
          set -euo pipefail
          base=https://github.com/ReVanced/aapt2/releases/download/v1.1.0
          fetch() {
            abi="$1"; asset="$2"; expected="$3"
            dest="app/src/main/jniLibs/$abi/libaapt2.so"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL "$base/$asset" -o "$dest"
            sum=$(sha256sum "$dest" | cut -d' ' -f1)
            echo "$asset sha256=$sum"
            [ "$sum" = "$expected" ] || { echo "SHA-256 mismatch for $asset (expected $expected)" >&2; exit 1; }
          }
          fetch arm64-v8a aapt2-arm64-v8a 7e5ae2e1f62fc24cab14072555ffd0a1a7e1ce27e82cc1008967b835b6d8df5b
          fetch armeabi-v7a aapt2-armeabi-v7a 466124dc6a412c39cb970a12ccaf2df054abf6f6e63e78690cd7b6e53263bd86
          fetch x86 aapt2-x86 52ab9dbdff56f5498dd6bf2c6a0400509330258d6db624d4c7a850314a6df715
          fetch x86_64 aapt2-x86_64 46d2244c3c574979ecae452c8a32e0a25ac0184bfe29a3d805821e36401ecdcb
          ls -l app/src/main/jniLibs/*/
      - name: Download Android NDK r29 (lzhiyong/termux-ndk) and bundle clang + lld
        run: |
          set -euo pipefail
          url=https://github.com/lzhiyong/termux-ndk/releases/download/android-ndk/android-ndk-r29-aarch64.tar.xz
          expected=02e10e4ddfe8deaeb0bd0cf29d04c981ed5bc8a5d6b560ebb9e7661f472d684b
          archive="$RUNNER_TEMP/android-ndk-r29-aarch64.tar.xz"
          curl -fsSL "$url" -o "$archive"
          sum=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "android-ndk-r29-aarch64.tar.xz sha256=$sum"
          [ "$sum" = "$expected" ] || { echo "SHA-256 mismatch for NDK archive (expected $expected)" >&2; exit 1; }
          ndk_dir="$RUNNER_TEMP/ndk"
          rm -rf "$ndk_dir"; mkdir -p "$ndk_dir"
          # '*' must NOT match '/', otherwise python3/bin and lib/**/bin are extracted too and the wrong bin folder is picked below.
          tar -xJf "$archive" -C "$ndk_dir" --wildcards --no-wildcards-match-slash '*/toolchains/llvm/prebuilt/*/bin/*' || true
          find_bin() { find "$ndk_dir" -type d -name bin -path '*/toolchains/llvm/prebuilt/*/bin' ! -path '*/prebuilt/*/*/bin' | head -n 1; }
          bin=$(find_bin)
          if [ -z "$bin" ] || [ ! -e "$bin/clang" ] || [ ! -e "$bin/ld.lld" ]; then
            echo "clang/ld.lld not found with the partial extract; extracting the whole archive." >&2
            tar -xJf "$archive" -C "$ndk_dir"
            bin=$(find_bin)
          fi
          if [ -z "$bin" ] || [ ! -e "$bin/clang" ] || [ ! -e "$bin/ld.lld" ]; then
            echo "clang or ld.lld not found in the NDK archive. bin folder: ${bin:-<none>}" >&2
            [ -n "$bin" ] && ls -la "$bin" >&2
            find "$ndk_dir" -maxdepth 7 \( -name 'clang*' -o -name '*lld*' \) | head -n 40 >&2
            exit 1
          fi
          echo "Using $bin"
          dest=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          # Resolve symlinks (clang -> clang-21, ld.lld -> lld) so the real executables are copied.
          cp "$(readlink -f "$bin/clang")" "$dest/libclang.so"
          cp "$(readlink -f "$bin/ld.lld")" "$dest/libld.lld.so"
          chmod 755 "$dest/libclang.so" "$dest/libld.lld.so"
          file "$dest/libclang.so" "$dest/libld.lld.so"
          ls -l "$dest"
      - name: Download Python 3.14.8 (daylight-00/python-build-standalone-android, upstream build) and bundle the interpreter
        run: |
          set -euo pipefail
          url='https://github.com/daylight-00/python-build-standalone-android/releases/download/20261003/cpython-3.14.8%2B20261003-aarch64-linux-android-upstream-install_only.tar.gz'
          expected=2f5bec7a83d88881dec0e82c8aec3f30610900b2fafd806e2fee26dd132b47de
          archive="$RUNNER_TEMP/python-android.tar.gz"
          curl -fsSL "$url" -o "$archive"
          sum=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "python archive sha256=$sum"
          [ "$sum" = "$expected" ] || { echo "SHA-256 mismatch for the Python archive (expected $expected)" >&2; exit 1; }
          py_dir="$RUNNER_TEMP/python-android"
          rm -rf "$py_dir"; mkdir -p "$py_dir"
          tar -xzf "$archive" -C "$py_dir"
          exe=$(find "$py_dir" -path '*/bin/python3' | head -n 1)
          if [ -z "$exe" ]; then
            echo "bin/python3 not found. Layout:" >&2
            find "$py_dir" -maxdepth 3 | head -n 60 >&2
            exit 1
          fi
          root=$(dirname "$(dirname "$exe")")
          dest=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          # Android 10+ only executes files from the native library directory, so the interpreter ships as lib<name>.so.
          cp "$(readlink -f "$exe")" "$dest/libpythonexe.so"
          chmod 755 "$dest/libpythonexe.so"
          echo "Interpreter dependencies:"
          readelf -d "$dest/libpythonexe.so" | grep NEEDED || true
          # Bundle every dependency that lives inside the Python tree (libpython3.14.so, ...) next to it.
          for needed in $(readelf -d "$dest/libpythonexe.so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            found=$(find "$root/lib" -maxdepth 1 -name "$needed" | head -n 1)
            [ -n "$found" ] || continue
            case "$needed" in *.so) ;; *) echo "Dependency $needed does not end in .so and cannot be packaged under jniLibs" >&2; exit 1;; esac
            cp "$(readlink -f "$found")" "$dest/$needed"
            echo "bundled $needed"
          done
          file "$dest/libpythonexe.so"
          ls -l "$dest"
      - name: Download Node.js (andiasriefail/node-android-build) and bundle it for every ABI
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_MAJOR: '24'
        run: |
          set -euo pipefail
          repo=andiasriefail/node-android-build
          # Known-good pin for x86_64 (checked when the resolved asset has the same SHA-256 owner release).
          x64_pinned=487cc205672d5c715a951835421e5eef4e2e3f629183c96ab0761c17a441f10b
          # release arch  ->  Android ABI folder
          for pair in arm64:arm64-v8a arm:armeabi-v7a x64:x86_64 ia32:x86; do
            arch=${pair%%:*}; abi=${pair##*:}
            tag="node-android-${arch}-${NODE_MAJOR}"
            echo "== $arch -> $abi (release $tag)"
            json=$(gh api "repos/$repo/releases/tags/$tag")
            # Newest asset = highest version in node-android-<arch>-<version>.tar.xz
            name=$(echo "$json" | jq -r '[.assets[].name | select(test("^node-android-.*\\.tar\\.xz$"))] | sort_by(capture("-(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)\\.tar\\.xz$").v | split(".") | map(tonumber)) | last')
            [ -n "$name" ] && [ "$name" != null ] || { echo "No tar.xz asset in $tag" >&2; exit 1; }
            url=$(echo "$json" | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .browser_download_url')
            digest=$(echo "$json" | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .digest // ""' | sed 's/^sha256://')
            archive="$RUNNER_TEMP/$name"
            curl -fsSL "$url" -o "$archive"
            sum=$(sha256sum "$archive" | cut -d' ' -f1)
            echo "$name sha256=$sum"
            if [ -n "$digest" ] && [ "$sum" != "$digest" ]; then echo "SHA-256 mismatch for $name (release says $digest)" >&2; exit 1; fi
            if [ "$arch" = x64 ] && [ "$sum" != "$x64_pinned" ]; then echo "::warning::x64 asset $name differs from the pinned SHA-256 ($x64_pinned). Update x64_pinned if this is a new Node version."; fi
            dir="$RUNNER_TEMP/node-$arch"; rm -rf "$dir"; mkdir -p "$dir"
            tar -xJf "$archive" -C "$dir"
            exe=$(find "$dir" -path '*/bin/node' | head -n 1)
            [ -n "$exe" ] || { echo "bin/node not found in $name" >&2; find "$dir" -maxdepth 3 | head -n 40 >&2; exit 1; }
            dest="app/src/main/jniLibs/$abi"; mkdir -p "$dest"
            # Android 10+ only executes files from the native library directory, so the binary ships as lib<name>.so.
            cp "$(readlink -f "$exe")" "$dest/libnodeexe.so"
            chmod 755 "$dest/libnodeexe.so"
            file "$dest/libnodeexe.so"
          done
          ls -l app/src/main/jniLibs/*/libnodeexe.so
      - name: Cache the Dart SDK archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dart-sdk-cache
          key: dart-sdk-${{ hashFiles('tools/dart-sdk.json') }}
      - name: Bundle the Dart runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('tools/dart-sdk.json'))['version'])")
          expected=$(python3 -c "import json; print(json.load(open('tools/dart-sdk.json'))['sha256'])")
          # The Dart SDK is built and released by a separate repository (tools/dart-sdk.json, entry "repo").
          dart_repo=$(python3 -c "import json; print(json.load(open('tools/dart-sdk.json'))['repo'])")
          tag="dart-android-arm64-$version"
          name="dart-sdk-android-arm64-$version.tar.gz"
          cache="$RUNNER_TEMP/dart-sdk-cache"
          mkdir -p "$cache"
          if [ -f "$cache/$name" ]; then
            echo "Using the cached $name"
          else
            gh release download "$tag" --pattern "$name" --dir "$cache" --repo "$dart_repo"
          fi
          # The checksum is verified every time, so a damaged or outdated cache entry can never be used.
          sum=$(sha256sum "$cache/$name" | cut -d' ' -f1)
          [ "$sum" = "$expected" ] || { rm -f "$cache/$name"; echo "SHA-256 mismatch for $name from $dart_repo: $sum (tools/dart-sdk.json expects $expected)" >&2; exit 1; }
          dart_dir="$RUNNER_TEMP/dart-runtime"
          rm -rf "$dart_dir"; mkdir -p "$dart_dir"
          tar -xzf "$cache/$name" -C "$dart_dir" dart-sdk/bin/dartaotruntime dart-sdk/bin/dartvm
          dest=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp "$dart_dir/dart-sdk/bin/dartaotruntime" "$dest/libdartaotruntime.so"
          cp "$dart_dir/dart-sdk/bin/dartvm" "$dest/libdartvm.so"
          chmod 755 "$dest/libdartaotruntime.so" "$dest/libdartvm.so"
          file "$dest/libdartaotruntime.so" "$dest/libdartvm.so"
          python3 tools/pin_dart_catalog.py
      - name: Cache the Flutter SDK archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter-sdk-cache
          key: flutter-sdk-${{ hashFiles('tools/flutter-sdk.json') }}
      - name: Bundle the Flutter executables and pin the Flutter SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Flutter SDK archive is made and released by the "Flutter SDK slim release" workflow (tools/flutter-sdk.json names repo, tag, asset and hash).
          field() { python3 -c "import json,sys; print(json.load(open('tools/flutter-sdk.json'))[sys.argv[1]])" "$1"; }
          flutter_repo=$(field repo); tag=$(field tag); name=$(field asset); expected=$(field sha256)
          cache="$RUNNER_TEMP/flutter-sdk-cache"
          mkdir -p "$cache"
          if [ -f "$cache/$name" ]; then
            echo "Using the cached $name"
          else
            gh release download "$tag" --pattern "$name" --dir "$cache" --repo "$flutter_repo"
          fi
          # The checksum is verified every time, so a damaged or outdated cache entry can never be used.
          sum=$(sha256sum "$cache/$name" | cut -d' ' -f1)
          [ "$sum" = "$expected" ] || { rm -f "$cache/$name"; echo "SHA-256 mismatch for $name from $flutter_repo: $sum (tools/flutter-sdk.json expects $expected)" >&2; exit 1; }
          # Android 10+ only runs executables from the native library directory, so these three leave the archive and ship inside the APK.
          dest=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          python3 - "$cache/$name" "$dest" <<'PY'
          import posixpath, shutil, sys, tarfile
          archive, dest = sys.argv[1], sys.argv[2]
          wanted = {
              "flutter/bin/cache/dart-sdk/bin/dart": "libflutterdart.so",
              "flutter/bin/cache/artifacts/engine/linux-arm64/gen_snapshot": "libgensnapshot.so",
              "flutter/bin/cache/artifacts/engine/linux-arm64/impellerc": "libimpellerc.so",
          }
          with tarfile.open(archive, "r:xz") as tar:
              members = {m.name: m for m in tar.getmembers()}
              for name, out in wanted.items():
                  member, hops = members.get(name), 0
                  while member is not None and member.issym() and hops < 8:
                      member = members.get(posixpath.normpath(posixpath.join(posixpath.dirname(member.name), member.linkname)))
                      hops += 1
                  if member is None or not member.isfile():
                      sys.exit("Not a regular file in the archive: " + name)
                  with tar.extractfile(member) as source, open(dest + "/" + out, "wb") as target:
                      shutil.copyfileobj(source, target)
                  print("extracted", name, "->", out, member.size, "bytes")
          PY
          chmod 755 "$dest/libflutterdart.so" "$dest/libgensnapshot.so" "$dest/libimpellerc.so"
          file "$dest/libflutterdart.so" "$dest/libgensnapshot.so" "$dest/libimpellerc.so"
          python3 tools/pin_flutter_catalog.py
      - name: Resolve the JDKs and Gradle distributions (tools/gradle-jdk.json) and register them in the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Everything (repo, tag, JDK majors, Gradle versions, which JDK is bundled in the APK, the
          # java/javac/jmod/jar/jlink launchers of every JDK major) is read from tools/gradle-jdk.json; nothing is hard-coded in this workflow.
          resolved="$RUNNER_TEMP/gradle-jdk-resolved.json"
          python3 tools/resolve_gradle_jdk.py "$resolved"
          python3 tools/pin_gradle_jdk_catalog.py "$resolved"
          for abi in arm64-v8a armeabi-v7a; do
            ls app/src/main/jniLibs/$abi/libjava[0-9]*exe.so > /dev/null 2>&1 || echo "::warning::No libjava<major>exe.so for $abi: Gradle projects cannot be built on those phones."
          done
      - name: Build the JSX/TypeScript transpiler (Sucrase, bundled for QuickJS)
        run: |
          set -euo pipefail
          sucrase=$(python3 -c "import json; print(json.load(open('tools/web-tools.json'))['sucrase'])")
          esbuild=$(python3 -c "import json; print(json.load(open('tools/web-tools.json'))['esbuild'])")
          out="$GITHUB_WORKSPACE/app/src/main/assets/build-tools/web"
          work="$RUNNER_TEMP/sucrase-build"
          rm -rf "$work"; mkdir -p "$work" "$out"
          cd "$work"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --save-exact "sucrase@$sucrase" "esbuild@$esbuild"
          printf 'export { transform } from "sucrase";\n' > entry.mjs
          npx esbuild entry.mjs --bundle --format=iife --global-name=Sucrase --platform=browser --target=es2019 --minify --outfile="$out/sucrase.js"
          node "$GITHUB_WORKSPACE/tools/sucrase-smoke.js" "$out/sucrase.js"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-disabled: false
          cache-read-only: false
      - name: Choose Gradle command
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi
      - name: Run unit tests
        run: $GRADLE_CMD --no-daemon --info test
      - name: Build debug APK
        run: $GRADLE_CMD --no-daemon --info assembleDebug
      - name: Verify the native libraries in the APK (QuickJS must exist for 32-bit and 64-bit)
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $apk"
          echo "---- native libraries per ABI ----"
          unzip -l "$apk" | awk '{print $4}' | grep -E '^lib/[^/]+/.+\.so$' | sort
          for abi in armeabi-v7a arm64-v8a; do
            if ! unzip -l "$apk" | awk '{print $4}' | grep -E "^lib/$abi/libjava[0-9]+exe\\.so$" > /dev/null; then
              echo "::warning::No libjava<major>exe.so for $abi: Gradle projects cannot be built on those phones."
            fi
            if ! unzip -l "$apk" | awk '{print $4}' | grep -E "^lib/$abi/.*quickjs.*\.so$" > /dev/null; then
              echo "::error::The QuickJS library is missing for $abi, so JSX/TypeScript builds would crash on those phones."
              exit 1
            fi
          done
      - name: Rename the APK to Studio-Mobile.apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "No APK found to rename" >&2; exit 1; }
          mkdir -p dist
          cp "$apk" dist/Studio-Mobile.apk
          ls -l dist
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Studio Mobile
          path: dist/Studio-Mobile.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        # Only from the main branch; runs on other branches (Dependabot, PRs) just upload the artifact.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          tag="v${version:-0.0.0}-build.${{ github.run_number }}"
          gh release create "$tag" dist/Studio-Mobile.apk \
            --target "${{ github.sha }}" \
            --title "Studio Mobile $tag" \
            --generate-notes
          echo "Released $tag"
