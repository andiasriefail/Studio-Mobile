[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
documentfile = "1.1.0"
appcompat = "1.7.1"
material = "1.14.0"
junit = "4.13.2"

# Build engine
ecj = "3.46.0"
kotlin-compiler = "2.4.20"
r8 = "9.4.29"
apksig = "9.4.1"
bouncycastle = "1.85"
xz = "1.10"
quickjs = "0.9.2"
zip4j = "2.11.5"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }

# Build engine — in-process Java/Kotlin compiler, DEX, and APK signing
build-ecj = { module = "org.eclipse.jdt:ecj", version.ref = "ecj" }
build-kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin-compiler" }
build-r8 = { module = "com.android.tools:r8", version.ref = "r8" }
build-apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
build-bouncycastle = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
build-xz = { module = "org.tukaani:xz", version.ref = "xz" }
build-quickjs = { module = "app.cash.quickjs:quickjs-android", version.ref = "quickjs" }
build-zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
